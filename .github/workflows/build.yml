name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # Runs on its own rather than gating the platform builds: it is seconds where
  # they are minutes, so a red cross appears long before they finish, and a
  # broken toolchain on one platform should not hide a failing test.
  #
  # Its own Node version on purpose. The build jobs pin 18; vitest 4 requires
  # ^20 || ^22 || >=24, so sharing their version would fail at startup rather
  # than on a test.
  client-tests:
    name: Client tests
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8

    - name: Test
      run: |
        cd client
        pnpm i
        pnpm test

  build-linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Rust Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y lld autogen libasound2-dev pkg-config make libssl-dev gcc g++ curl wget git libwebkit2gtk-4.1-dev

    - name: Install NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8

    - name: Build
      run: |
        cd client
        pnpm i
        pnpm run build
        cd ..
        cargo update
        cargo build --release

    - name: Bundle
      run: |
        tar zcf OneTagger-linux.tar.gz -C target/release onetagger
        tar zcf OneTagger-linux-cli.tar.gz -C target/release onetagger-cli
        mkdir dist
        mv OneTagger-linux.tar.gz dist/
        mv OneTagger-linux-cli.tar.gz dist/
    
    - name: Upload Linux
      uses: actions/upload-artifact@v4
      with:
        name: onetagger-linux
        path: dist/OneTagger-linux.tar.gz
    
    - name: Upload Linux CLI
      uses: actions/upload-artifact@v4
      with:
        name: onetagger-linux-cli
        path: dist/OneTagger-linux-cli.tar.gz

  build-win:
    name: Windows
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Rust Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8

    - name: Install Dependencies
      run: |
        choco install nsis -y
        rustup update

    - name: Build
      run: |
        cd client
        pnpm i
        pnpm run build
        cd ..
        cargo update
        cargo build --release
        
    - name: Bundle
      run: |
        mkdir dist
        powershell -command "(new-object System.Net.WebClient).DownloadFile('https://aka.ms/vs/16/release/vc_redist.x64.exe','vc_redist.x64.exe')"
        powershell -command "(new-object System.Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/p/?LinkId=2124703','MicrosoftEdgeWebview2Setup.exe')"
        &'C:\Program Files (x86)\NSIS\makensis.exe' 'assets\installer.nsi'
        copy target\release\onetagger.exe dist\OneTagger-windows.exe
        copy target\release\onetagger-cli.exe dist\OneTagger-windows-cli.exe

    - name: Upload Archive
      uses: actions/upload-artifact@v4
      with:
        name: onetagger-win
        path: | 
          dist/OneTagger-windows.exe
    
    - name: Upload Archive
      uses: actions/upload-artifact@v4
      with:
        name: onetagger-win-setup
        path: dist/OneTagger-windows-setup.exe

    - name: Upload CLI
      uses: actions/upload-artifact@v4
      with:
        name: onetagger-win-cli
        path: |
          dist/OneTagger-windows-cli.exe

  build-mac:
    name: Mac
    runs-on: macos-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Rust Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install dependencies
      run: |
        # The official installer rather than `brew install rustup`. Homebrew's
        # formula installs rustup itself but never runs rustup-init, so no cargo
        # shim is created in ~/.cargo/bin -- the toolchain lands under ~/.rustup
        # and nothing on PATH can reach it. `rustup default stable` succeeds and
        # the very next line still dies with "cargo: command not found", which is
        # what the previous two attempts at this ran into.
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        # `source` for this shell, GITHUB_PATH for the later ones. Different
        # scopes: neither alone is enough.
        source "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        # Fail here, naming itself, rather than several steps later as an exit
        # code from whatever happened to run next.
        cargo --version
        # Test the condition rather than ignore every error. The Rust Cache
        # step restores ~/.cargo/bin, so on any run after the first this binary
        # is already there and `cargo install` exits 101 with "already exists in
        # destination". `|| true` used to hide that -- and hid cargo being
        # missing entirely along with it, which is what made the original
        # failure surface several steps from its cause. `--force` would work but
        # rebuilds it from source every run for nothing.
        command -v cargo-bundle >/dev/null || cargo install cargo-bundle --version 0.6.1 --locked
    
    - name: Install NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8

    - name: Build
      run: |
        cd client
        pnpm i
        pnpm run build
        cd ..
        cargo update
        cargo build --release
        cargo bundle --release

    - name: Bundle
      run: |
        mkdir dist

        cd target/release/bundle/osx
        chmod +x OneTagger.app/Contents/MacOS/onetagger
        zip -r OneTagger-mac.zip .
        cd -

        cd target/release
        chmod +x onetagger-cli
        zip OneTagger-mac-cli.zip onetagger-cli
        cd -

        mv target/release/bundle/osx/OneTagger-mac.zip dist/
        mv target/release/OneTagger-mac-cli.zip dist/

    - name: Upload Mac
      uses: actions/upload-artifact@v4
      with:
        name: onetagger-mac
        path: dist/OneTagger-mac.zip

    - name: Upload Mac CLI
      uses: actions/upload-artifact@v4
      with:
        name: onetagger-mac-cli
        path: dist/OneTagger-mac-cli.zip
